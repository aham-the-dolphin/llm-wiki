[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki"
version = "0.1.0"
description = "A lightweight wiki ingestion and validation toolkit for structured markdown sources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.7",
    "rich>=13.0",
    "python-frontmatter>=0.5",
    "markdown-it-py>=3.0",
    "pytest>=8.0",
    "ruff>=0.0",
    "mypy>=1.7",
]

[project.scripts]
llm-wiki = "llm_wiki.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".git", "build", "dist", "__pycache__", ".venv"]
